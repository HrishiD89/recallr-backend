# ── Datasource (Supabase via env vars set in Render dashboard) ────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HikariCP — keep pool small on free tier (512 MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL}
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Gemini ────────────────────────────────────────────────────────────────────
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.embedding-model=models/gemini-embedding-001
gemini.generation-model=gemini-3.1-flash-lite
gemini.embedding-dimensions=768

# ── RSA keys supplied as env vars (PEM string, newlines preserved) ────────────
# These replace the classpath file references in application.properties.
# Set RSA_PUBLIC_KEY and RSA_PRIVATE_KEY in the Render dashboard.
rsa.public-key-content=${RSA_PUBLIC_KEY}
rsa.private-key-content=${RSA_PRIVATE_KEY}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Add your Chrome extension ID and any other origins here
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:chrome-extension://jmpfdbjcnbhbkppbbichabineejfelek}

# ── Fallback Scraper API Keys ─────────────────────────────────────────────────
jina.api.key=${JINA_API_KEY:}
tinyfish.api.key=${TINYFISH_API_KEY:}

# ── Server port (Render injects PORT automatically) ───────────────────────────
server.port=${PORT:8080}
